# Local development services only. Production uses MongoDB Atlas + managed Redis.
services:
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    restart: unless-stopped
volumes:
  mongo-data:
