# Production stack:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# SECRET_KEY and POSTGRES_PASSWORD are mandatory; Compose refuses to start without them.
name: pm-suite-prod

x-backend: &backend
  build:
    context: ./backend
  image: pm-suite-backend:prod
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (see .env.example)}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    POSTGRES_HOST: db
    DEBUG: "False"
    MEDIA_ROOT: /app/media
    PRIVATE_STORAGE_ROOT: /data/private
  volumes:
    - media:/app/media
    - private_files:/data/private
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_suite}
      POSTGRES_USER: ${POSTGRES_USER:-pm_suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    command:
      - gunicorn
      - config.asgi:application
      - -k
      - uvicorn_worker.UvicornWorker
      - -b
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --access-logfile
      - "-"
    volumes:
      - media:/app/media
      - private_files:/data/private
      - static:/app/staticfiles

  celery:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES:-30}
    image: pm-suite-frontend:prod
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media:
  private_files:
  static:
