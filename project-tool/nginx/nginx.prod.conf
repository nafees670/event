# Production reverse proxy. Terminate TLS here or at a load balancer in front;
# Django trusts X-Forwarded-Proto for SECURE_SSL_REDIRECT and secure cookies.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream django { server backend:8000; }
upstream nextjs { server frontend:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    location /api/  { proxy_pass http://django; }
    location /admin/ { proxy_pass http://django; }
    location /media/ { proxy_pass http://django; }

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
    }
}
